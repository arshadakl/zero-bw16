name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Add Realtek AmebaD board package
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/ambiot/ambd_arduino/raw/master/Arduino_package/package_realtek.com_amebad_index.json
          arduino-cli core update-index
          arduino-cli core install realtek:AmebaD

      - name: Build firmware
        run: |
          arduino-cli compile \
            --fqbn realtek:AmebaD:bw16 \
            --build-path build \
            --warnings none \
            .

      - name: List build output
        run: ls -la build/

      - name: Find firmware binary
        id: find_bin
        run: |
          BIN=$(find build -name "*.bin" | head -1)
          echo "bin_path=$BIN" >> $GITHUB_OUTPUT

      - name: Rename binary
        run: cp "${{ steps.find_bin.outputs.bin_path }}" zero-bw16-${{ github.ref_name }}.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Zero-BW16 ${{ github.ref_name }}
          files: zero-bw16-${{ github.ref_name }}.bin
          body: |
            ## Zero-BW16 ${{ github.ref_name }}

            Pre-built firmware for **AI-Thinker BW16 (RTL8720DN)**.

            ### Flash Instructions

            **Step 1 — Enter download mode:**
            1. Hold **BOOT** button
            2. Press and release **RESET**
            3. Release **BOOT**

            **Step 2 — Flash (pick one method):**

            **PlatformIO:**
            ```bash
            pio run -t upload
            ```

            **Realtek AmebaD ImageTool (Windows GUI):**
            - Download from [ambiot/ambd_sdk](https://github.com/ambiot/ambd_sdk) → `tools/`
            - Open tool → select COM port → load `zero-bw16-${{ github.ref_name }}.bin` → Download

            **Step 3 — Connect:**
            - WiFi: `zero-bw16` / `zerobw16!`
            - Web UI: `http://192.168.1.1`

            > Change default credentials immediately in the Settings tab.

            ### OTA Updates
            After first flash, upload new `.bin` directly at `http://192.168.1.1` → Settings → OTA Update. No USB cable needed.
